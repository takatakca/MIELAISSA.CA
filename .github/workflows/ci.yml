name: Miel Aissa CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} and JavaScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax and storefront contract checks
        run: bash scripts/check.sh
      - name: JavaScript syntax
        run: node --check wordpress/wp-content/plugins/mielaissa-storefront/assets/storefront.js

  package:
    name: Produce WordPress ZIP
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package WooCommerce storefront plugin
        run: |
          set -euo pipefail
          cd wordpress/wp-content/plugins
          zip -r "$GITHUB_WORKSPACE/mielaissa-storefront.zip" mielaissa-storefront
          unzip -t "$GITHUB_WORKSPACE/mielaissa-storefront.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mielaissa-storefront-plugin
          path: mielaissa-storefront.zip
          if-no-files-found: error
