name: Miel Aissa public health

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mielaissa-public-health
  cancel-in-progress: false

jobs:
  public-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public homepage without customer data
        run: bash scripts/public-health.sh
