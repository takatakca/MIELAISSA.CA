name: Deploy Miel Aissa plugin

# CI-gated publication of only the plugin directory, never the WordPress root.
on:
  workflow_run:
    workflows: ["Miel Aissa CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mielaissa-production-plugin
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.MIELAISSA_DEPLOY_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CI-tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Revalidate source
        run: bash scripts/check.sh
      - name: Validate configuration
        env:
          HOST: ${{ vars.MIELAISSA_SSH_HOST }}
          PORT: ${{ vars.MIELAISSA_SSH_PORT }}
          USER: ${{ vars.MIELAISSA_SSH_USER }}
          WP_ROOT: ${{ vars.MIELAISSA_WP_ROOT }}
          KEY: ${{ secrets.MIELAISSA_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.MIELAISSA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for value in "$HOST" "$PORT" "$USER" "$WP_ROOT" "$KEY" "$HOST_KEYS"; do
            test -n "$value" || { echo "Missing SSH deployment setting"; exit 1; }
          done
          bash scripts/validate-wordpress-root.sh "$WP_ROOT" "$PORT" "$HOST" "$USER"
      - name: Install SSH credentials and pinned server key
        env:
          KEY: ${{ secrets.MIELAISSA_SSH_PRIVATE_KEY }}
          HOST_KEYS: ${{ secrets.MIELAISSA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Verify Miel Aissa WordPress target before upload
        env:
          HOST: ${{ vars.MIELAISSA_SSH_HOST }}
          PORT: ${{ vars.MIELAISSA_SSH_PORT }}
          USER: ${{ vars.MIELAISSA_SSH_USER }}
          WP_ROOT: ${{ vars.MIELAISSA_WP_ROOT }}
        run: |
          set -euo pipefail
          ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" bash -s -- "$WP_ROOT" <<'PREFLIGHT'
          set -euo pipefail
          root="$1"
          test -s "$root/wp-includes/version.php"
          test -d "$root/wp-content/plugins"
          command -v wp >/dev/null || { echo "WP-CLI is required to verify target" >&2; exit 1; }
          home="$(wp --path="$root" --skip-plugins --skip-themes option get home)"
          home="$(printf '%s' "$home" | sed 's:/$::')"
          case "$home" in
            https://mielaissa.ca|https://www.mielaissa.ca|http://mielaissa.ca|http://www.mielaissa.ca)
              echo "WordPress home verified: $home" ;;
            *) echo "REFUSED: wrong WordPress home URL" >&2; exit 1 ;;
          esac
          PREFLIGHT
      - name: Upload to staging directory and keep previous version
        env:
          HOST: ${{ vars.MIELAISSA_SSH_HOST }}
          PORT: ${{ vars.MIELAISSA_SSH_PORT }}
          USER: ${{ vars.MIELAISSA_SSH_USER }}
          WP_ROOT: ${{ vars.MIELAISSA_WP_ROOT }}
          VERSION_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PLUGINS="$WP_ROOT/wp-content/plugins"
          TARGET="$PLUGINS/mielaissa-storefront"
          REVISION="$(printf '%.12s' "$VERSION_SHA")"
          INCOMING="$PLUGINS/.mielaissa-incoming-$REVISION"
          BACKUP="$PLUGINS/.mielaissa-previous"
          REMOTE="$USER@$HOST"
          ssh -p "$PORT" -o BatchMode=yes "$REMOTE" "test -d '$PLUGINS' && mkdir -p '$INCOMING'"
          rsync -az --delete -e "ssh -p $PORT -o BatchMode=yes" \
            wordpress/wp-content/plugins/mielaissa-storefront/ "$REMOTE:$INCOMING/"
          ssh -p "$PORT" -o BatchMode=yes "$REMOTE" bash -s -- "$TARGET" "$INCOMING" "$BACKUP" <<'REMOTE_SCRIPT'
          set -euo pipefail
          target="$1"
          incoming="$2"
          backup="$3"
          test -s "$incoming/mielaissa-storefront.php"
          if [ -e "$backup" ]; then rm -rf -- "$backup"; fi
          if [ -e "$target" ]; then mv -- "$target" "$backup"; fi
          if ! mv -- "$incoming" "$target"; then
            if [ -d "$backup" ]; then mv -- "$backup" "$target"; fi
            exit 1
          fi
          test -s "$target/mielaissa-storefront.php"
          REMOTE_SCRIPT
      - name: Verify deployed main file checksum
        env:
          HOST: ${{ vars.MIELAISSA_SSH_HOST }}
          PORT: ${{ vars.MIELAISSA_SSH_PORT }}
          USER: ${{ vars.MIELAISSA_SSH_USER }}
          WP_ROOT: ${{ vars.MIELAISSA_WP_ROOT }}
        run: |
          set -euo pipefail
          FILE=wordpress/wp-content/plugins/mielaissa-storefront/mielaissa-storefront.php
          LOCAL_SHA="$(sha256sum "$FILE" | cut -d ' ' -f 1)"
          REMOTE_SHA="$(ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" "sha256sum '$WP_ROOT/wp-content/plugins/mielaissa-storefront/mielaissa-storefront.php' | cut -d ' ' -f 1")"
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "Checksum mismatch; restoring previous plugin where available." >&2
            ssh -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
              bash -s -- "$WP_ROOT/wp-content/plugins" <<'ROLLBACK'
          set -euo pipefail
          plugins="$1"
          target="$plugins/mielaissa-storefront"
          previous="$plugins/.mielaissa-previous"
          failed="$plugins/.mielaissa-failed"
          if [ -e "$failed" ]; then rm -rf -- "$failed"; fi
          if [ -d "$target" ]; then mv -- "$target" "$failed"; fi
          if [ -d "$previous" ]; then mv -- "$previous" "$target"; fi
          ROLLBACK
            exit 1
          fi
          echo "Plugin content verified. WordPress activation not implied."
